<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyser Lojistik — Operasyon Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #f3f4f6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    #root { min-height: 100vh; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f3f4f6; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top: 3px solid #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading p { color: #9ca3af; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <p>Yükleniyor...</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAqIh2zlolD2g4usd3Iy8gZkvhIwS9NN8Y",
      authDomain: "eyser-lojistik.firebaseapp.com",
      projectId: "eyser-lojistik",
      storageBucket: "eyser-lojistik.firebasestorage.app",
      messagingSenderId: "932277548852",
      appId: "1:932277548852:web:4a2c0d76ed8e1a0f08d761"
    };

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Global state
    let ops = [];
    let unsubscribe = null;

    // Firestore listeners
    function startRealtimeSync() {
      if (unsubscribe) unsubscribe();
      unsubscribe = onSnapshot(collection(db, "ops"), (snapshot) => {
        ops = snapshot.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => new Date(b.tarih || 0) - new Date(a.tarih || 0));
        console.log("📊 Operasyonlar güncellendi:", ops.length);
        window.dispatchEvent(new CustomEvent('opsUpdated'));
      }, (err) => {
        console.error("Firestore sync error:", err);
      });
    }

    // Export global functions
    window.firebase = { db, storage, ops: () => ops, startSync: startRealtimeSync };

    // Start listening
    startRealtimeSync();
  </script>

  <!-- React & App -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // Buraya React uygulaması gelecek - eyser-panel.jsx'i uyarlanmış hali
    // Basit test uygulaması
    function App() {
      const [ops, setOps] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        const timer = setTimeout(() => {
          setOps(window.firebase.ops());
          setLoading(false);
        }, 1000);
        
        const handleUpdate = () => {
          setOps(window.firebase.ops());
        };
        
        window.addEventListener('opsUpdated', handleUpdate);
        return () => {
          clearTimeout(timer);
          window.removeEventListener('opsUpdated', handleUpdate);
        };
      }, []);

      if (loading) {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: '#f3f4f6' }}>
            <div style={{ width: 40, height: 40, border: '3px solid #e5e7eb', borderTop: '3px solid #f59e0b', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
            <p style={{ color: '#9ca3af', marginTop: 16 }}>Yükleniyor...</p>
          </div>
        );
      }

      return (
        <div style={{ padding: 20, maxWidth: 1200, margin: '0 auto' }}>
          <h1 style={{ color: '#111827', marginBottom: 20 }}>📊 Eyser Lojistik — Firebase Operasyon Paneli</h1>
          <div style={{ background: '#fff', border: '1px solid #e5e7eb', borderRadius: 12, padding: 20 }}>
            <h2 style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>✅ Firebase Bağlantısı Başarılı!</h2>
            <p style={{ color: '#6b7280', marginBottom: 10 }}>Toplam operasyon: <strong style={{ color: '#f59e0b' }}>{ops.length}</strong></p>
            <p style={{ color: '#6b7280', marginBottom: 10 }}>Firestore ve Storage kurulmuş ve senkron çalışıyor.</p>
            <div style={{ background: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: 8, padding: 12, marginTop: 16, fontSize: 12, color: '#9ca3af', fontFamily: 'monospace' }}>
              <strong>Şu anda kurulu:</strong><br/>
              ✅ Firebase Firestore<br/>
              ✅ Firebase Storage<br/>
              ✅ Realtime Sync<br/>
              <br/>
              📝 Sonraki adım: Tam React uygulaması entegrasyonu
            </div>
          </div>
          <div style={{ marginTop: 30, padding: 20, background: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: 12 }}>
            <h3 style={{ color: '#1e40af', marginBottom: 10 }}>🚀 Netlify Deploy Hazırlığı</h3>
            <p style={{ color: '#1e40af', fontSize: 14 }}>
              Dosya hazır! Şimdi sana Netlify'a deploy etme talimatlarını vereceğim.
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
